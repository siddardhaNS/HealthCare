packages:
  - apps/*
  - packages/*

# Expo SDK 54+ supports pnpm's default isolated installs. If native module
# resolution breaks on a device build, switch to `nodeLinker: hoisted` here.

# One React for every app and shared package (Expo SDK 58 pins 19.3.0).
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  typescript: 6.0.3
  zod: 4.6.7
  vitest: 5.0.5

allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
  # Downloads the sentry-cli binary (source-map upload for Sentry).
  '@sentry/cli': true
  # Workflow SDK compiler (checks/installs its native binary).
  '@swc/core': true
  # Optional native CBOR speed-up under the Workflow SDK; the JS fallback is fine.
  cbor-extract: false

# One Upstash client version everywhere (drizzle-orm lists it as an optional peer).
overrides:
  '@upstash/redis': 1.39.0
  # GHSA-xjj6-f33q-929c (DoS) in undici <7.30.1, via the Workflow SDK. Drop when it ships a patched undici.
  'undici@>=7.18.0 <7.30.1': 7.30.1

# Ignored advisories (reviewed 2026-10-27). Both reach us only through Expo's
# build CLI (@expo/cli), which runs on dev machines and CI and is not
# shipped in the apps. Remove when Expo upgrades them.
# - node-forge <=1.4.0 (no patched release yet), via @expo/code-signing-certificates
# - zod 3.x memory exhaustion, via @expo/cli (our own code uses zod 4.6.7)
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-mrhx-c7xc-m3w5
