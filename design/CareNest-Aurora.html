<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareNest · Aurora design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Sora:wght@500;600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
:root{color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;background:#0A0815;color:#EEEAFB;font-family:Inter,system-ui,sans-serif}
.cn-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;background:#110E22;border-bottom:1px solid #262145}
.cn-brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.cn-brand small{font-weight:600;color:#A39CC7;font-size:12.5px}
.cn-tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:#0A0815;border:1px solid #262145;margin-left:auto;flex-wrap:wrap}
.cn-tab{height:38px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:#A39CC7;font:600 13.5px Inter,system-ui,sans-serif;cursor:pointer}
.cn-tab[aria-selected="true"]{background:#B4F35A;color:#132006}
.cn-panel[hidden]{display:none}
.cn-stage{min-height:calc(100vh - 63px);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;box-sizing:border-box;background:#0A0815}
.cn-phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #110E22,0 0 0 11px #262145,0 40px 100px rgba(0,0,0,.45);flex-shrink:0}
@media (max-width:440px){.cn-stage{padding:0}.cn-phone{border-radius:0;box-shadow:none;width:100%}}
</style>
</head>
<body>
<header class="cn-bar">
<div class="cn-brand">CareNest <small>Aurora design · interactive prototype</small></div>
<div class="cn-tabs" role="tablist" aria-label="Screens">
<button class="cn-tab" role="tab" aria-selected="true" data-tab="landing">Landing page</button>
<button class="cn-tab" role="tab" aria-selected="false" data-tab="app">Resident app</button>
<button class="cn-tab" role="tab" aria-selected="false" data-tab="admin">Admin console</button>
</div>
</header>
<section class="cn-panel" id="panel-landing" role="tabpanel"><div id="mount-landing"></div></section>
<section class="cn-panel" id="panel-app" role="tabpanel" hidden><div class="cn-stage"><div class="cn-phone" id="mount-app"></div></div></section>
<section class="cn-panel" id="panel-admin" role="tabpanel" hidden><div id="mount-admin"></div></section>
<template id="tpl-app">

<div style="{{s.root}}">

<template data-sc="if" value="{{is.home}}" hint-placeholder-val="{{true}}">
<div style="{{s.screen}}">
<main style="{{s.main}}">
<header style="display: flex; align-items: center; gap: 12px">
<div style="{{s.avatarAccent}}">LR</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="{{s.sub}}">Good evening</span><span style="{{s.name}}">Lakshmi Rao</span></div>
<button aria-label="Notifications" onClick="{{openNotif}}" style="{{s.iconBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg><template data-sc="if" value="{{unread}}" hint-placeholder-val="{{true}}"><span style="{{s.dot}}"></span></template></button>
</header>

<template data-sc="if" value="{{sosOn}}" hint-placeholder-val="{{false}}">
<button onClick="{{goSOS}}" style="{{s.sosBanner}}"><span style="{{s.sosPulse}}"></span><span style="flex-grow: 1; text-align: left">SOS active · {{sosShort}}</span><span style="font-size: 12px">Open</span></button>
</template>

<button onClick="{{goHealth}}" style="{{s.snapBtn}}">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span style="{{s.label}}">Health snapshot</span><span style="{{s.linkTxt}}">View trends</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%">
<template data-sc="for" list="{{snap}}" as="sn" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="{{sn.icoStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sn.d}}"></path></svg></span><span style="{{sn.valStyle}}">{{sn.value}}</span><span style="{{s.tiny}}">{{sn.label}}</span></div></template>
</div>
<div style="{{s.divider}}; width: 100%"></div>
<span style="{{s.sub}}">{{snapNote}}</span>
</button>

<button onClick="{{startSOS}}" style="{{s.sosCard}}">
<span style="{{s.sosOrb}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18v-6a5 5 0 0 1 10 0v6"></path><path d="M5 21h14"></path><path d="M12 2v2"></path><path d="M4.2 6.2l1.4 1.4"></path><path d="M19.8 6.2l-1.4 1.4"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; text-align: left"><span style="{{s.sosTitle}}">Emergency SOS</span><span style="{{s.sosSub}}">Alerts nearby ambulances and the community desk</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</button>

<section style="display: flex; flex-direction: column; gap: 10px">
<span style="{{s.label}}">Care services</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{goConsult}}" style="{{s.tile}}"><span style="{{s.icoConsult}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a4 4 0 0 0 8 0V3"></path><path d="M10 13v2a5 5 0 0 0 10 0v-2"></path><circle cx="20" cy="10" r="2"></circle></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="{{s.tileTitle}}">Consult a doctor</span><span style="{{s.sub}}">Video, by specialty</span></span></button>
<button onClick="{{goPharmacy}}" style="{{s.tile}}"><span style="{{s.icoPharm}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 20.5l10-10a4.95 4.95 0 0 0-7-7l-10 10a4.95 4.95 0 0 0 7 7z"></path><path d="M8.5 8.5l7 7"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="{{s.tileTitle}}">Order medicines</span><span style="{{s.sub}}">From partner pharmacies</span></span></button>
<button onClick="{{goLabs}}" style="{{s.tile}}"><span style="{{s.icoLab}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"></path><path d="M7.5 15h9"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="{{s.tileTitle}}">Lab tests at home</span><span style="{{s.sub}}">Reports in the app</span></span></button>
<button onClick="{{goCompanion}}" style="{{s.tile}}"><span style="{{s.icoComp}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="{{s.tileTitle}}">Visit companion</span><span style="{{s.sub}}">Escort there and back</span></span></button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<span style="{{s.label}}">Coming up</span>
<div style="{{s.card}}; padding: 12px; display: flex; align-items: center; gap: 12px">
<div style="{{s.dateBox}}"><span style="{{s.dateTop}}">TODAY</span><span style="{{s.dateTime}}">{{booking.short}}</span></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="{{s.tileTitle}}">{{booking.doc}}</span><span style="{{s.sub}}">{{booking.spec}} · {{booking.type}} consult</span></div>
<button onClick="{{joinCall}}" style="{{s.smallPrimary}}">Join</button>
</div>
<div style="{{s.card}}; padding: 12px; display: flex; align-items: center; gap: 12px">
<div style="{{s.dateBoxPharm}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 20.5l10-10a4.95 4.95 0 0 0-7-7l-10 10a4.95 4.95 0 0 0 7 7z"></path><path d="M8.5 8.5l7 7"></path></svg></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="{{s.tileTitle}}">Telmisartan 40 mg</span><span style="{{s.sub}}">Evening dose · 9:00 PM</span></div>
<button onClick="{{toggleTaken}}" style="{{s.takenBtn}}">{{takenLabel}}</button>
</div>
</section>
</main>
</div>
</template>

<template data-sc="if" value="{{is.consult}}" hint-placeholder-val="{{false}}">
<div style="{{s.screen}}">
<main style="{{s.main}}">
<header style="display: flex; align-items: center; gap: 12px">
<button aria-label="Back" onClick="{{goHome}}" style="{{s.iconBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="{{s.sub}}">Telemedicine</span><h1 style="{{s.h1}}">Consult a doctor</h1></div>
</header>
<div role="group" aria-label="Consult type" style="{{s.seg3}}">
<template data-sc="for" list="{{ctypes}}" as="c" hint-placeholder-count="3"><button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></template>
</div>
<label style="{{s.label}}; display: flex; flex-direction: column; gap: 8px">What are you feeling?
<input type="text" value="{{symptom}}" onChange="{{onSymptom}}" placeholder="Try: chest pain, knee pain, rash" style="{{s.input}}">
</label>
<template data-sc="if" value="{{symptomHint}}" hint-placeholder-val="{{false}}"><span style="{{s.hint}}">Suggested specialty: {{spec}}</span></template>
<section style="display: flex; flex-direction: column; gap: 10px">
<span style="{{s.label}}">Specialty</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{specs}}" as="sp" hint-placeholder-count="7"><button onClick="{{sp.pick}}" style="{{sp.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sp.d}}"></path></svg>{{sp.label}}</button></template>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<span style="{{s.label}}">Available today</span>
<template data-sc="for" list="{{docs}}" as="d" hint-placeholder-count="2">
<article style="{{d.style}}">
<div style="display: flex; gap: 12px; align-items: center">
<div style="{{s.avatarRound}}">{{d.ini}}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600; font-size: 15px">{{d.name}}</span><span style="{{s.sub}}">{{d.meta}}</span></div>
<span style="{{s.price}}">₹{{d.fee}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<template data-sc="for" list="{{d.slots}}" as="sl" hint-placeholder-count="4"><button onClick="{{sl.pick}}" style="{{sl.style}}">{{sl.label}}</button></template>
</div>
</article>
</template>
</section>
<section style="{{s.card}}; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="{{s.label}}; margin-bottom: 6px">Share with the doctor</span>
<template data-sc="for" list="{{shareItems}}" as="si" hint-placeholder-count="4"><label style="{{si.row}}"><span style="{{si.ico}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{si.d}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 13.5px; font-weight: 600">{{si.label}}</span><span style="{{s.sub}}">{{si.sub}}</span></span><input type="checkbox" checked="{{si.on}}" onChange="{{si.toggle}}" style="{{s.checkAccent}}"></label></template>
</section>
</main>
<footer style="{{s.footer}}">
<div style="{{s.sub}}; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>{{shareNote}}</div>
<button onClick="{{bookConsult}}" style="{{s.btnConsult}}">Book {{ctypeLower}} consult · {{slot}} · ₹{{fee}}</button>
</footer>
</div>
</template>

<template data-sc="if" value="{{is.consultDone}}" hint-placeholder-val="{{false}}">
<div style="{{s.screen}}">
<main style="{{s.main}}; justify-content: center; align-items: center; text-align: center; gap: 18px">
<span style="{{s.successOrb}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span>
<h1 style="{{s.h1}}; font-size: 26px">Consult booked</h1>
<div style="{{s.card}}; padding: 16px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; text-align: left">
<span style="font-weight: 600; font-size: 16px">{{booking.doc}}</span>
<span style="{{s.sub}}">{{booking.spec}} · {{booking.type}} consult</span>
<span style="{{s.monoAccent}}">Today · {{booking.slot}} · ₹{{booking.fee}}</span>
</div>
<span style="{{s.sub}}">We'll remind you 10 minutes before. Join from Home or Bookings.</span>
</main>
<footer style="{{s.footer}}">
<button onClick="{{goBookings}}" style="{{s.btnConsult}}">View my bookings</button>
<button onClick="{{goHome}}" style="{{s.ghostFull}}">Back to home</button>
</footer>
</div>
</template>

<template data-sc="if" value="{{is.call}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: #05080C; color: #F2F5F8">
<div style="padding: 24px 20px 0; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 16px">{{booking.doc}}</span><span style="font-size: 12px; color: #9AA6B4">{{booking.spec}} · encrypted video</span></span>
<span style="{{s.callTimer}}">{{callTime}}</span>
</div>
<div style="flex-grow: 1; margin: 18px 20px; border-radius: 28px; background: #101820; border: 1px solid #1E2A36; position: relative; display: flex; align-items: center; justify-content: center">
<span style="width: 132px; height: 132px; border-radius: 50%; background: #16303A; color: #7FE7D6; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 600">{{booking.ini}}</span>
<div style="position: absolute; right: 14px; bottom: 14px; width: 96px; height: 128px; border-radius: 18px; background: #1A2430; border: 1px solid #2B3947; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9AA6B4">{{selfView}}</div>
<template data-sc="if" value="{{muted}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 14px; top: 14px; padding: 6px 10px; border-radius: 999px; background: #2A0F12; color: #FFB3B5; font-size: 12px; font-weight: 600">You're muted</span></template>
</div>
<div style="padding: 0 20px 28px; display: flex; justify-content: center; gap: 16px">
<button aria-label="Toggle microphone" onClick="{{toggleMute}}" style="{{s.callBtnMute}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 17v4"></path></svg></button>
<button aria-label="Toggle camera" onClick="{{toggleCam}}" style="{{s.callBtnCam}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg></button>
<button aria-label="End call" onClick="{{endCall}}" style="width: 64px; height: 64px; border-radius: 50%; border: 0; background: #FF5A5F; color: #1C0A0C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg></button>
</div>
</div>
</template>

<template data-sc="if" value="{{is.pharmacy}}" hint-placeholder-val="{{false}}">
<div style="{{s.screen}}">
<main style="{{s.main}}">
<header style="display: flex; align-items: center; gap: 12px">
<button aria-label="Back" onClick="{{goHome}}" style="{{s.iconBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="{{s.sub}}">Pharmacy</span><h1 style="{{s.h1}}">Order medicines</h1></div>
<button aria-label="Search medicines" onClick="{{toggleSearch}}" style="{{s.iconBtn}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg></button>
</header>
<template data-sc="if" value="{{searchOpen}}" hint-placeholder-val="{{false}}">
<div style="{{s.card}}; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<label style="{{s.label}}; display: flex; flex-direction: column; gap: 8px">Search medicines<input type="text" value="{{query}}" onChange="{{onQuery}}" placeholder="Name or salt" style="{{s.input}}"></label>
<template data-sc="for" list="{{results}}" as="r" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 10px"><span style="{{r.ico}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13.5px; font-weight: 600">{{r.name}}</span><span style="{{s.sub}}">{{r.pack}} · ₹{{r.price}}</span></span><button onClick="{{r.add}}" style="{{r.style}}">{{r.cta}}</button></div></template>
</div>
</template>
<section style="{{s.trackCard}}">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="{{s.monoPharm}}">#{{order.id}}</span><span style="{{s.pharmStrong}}">{{order.status}}</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><template data-sc="for" list="{{order.bars}}" as="b" hint-placeholder-count="4"><span style="{{b.style}}"></span></template></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><template data-sc="for" list="{{order.bars}}" as="b" hint-placeholder-count="4"><span style="{{b.labelStyle}}">{{b.label}}</span></template></div>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{pickUpload}}" style="{{s.rxUpload}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg>Upload Rx</button>
<button onClick="{{pickErx}}" style="{{s.rxErx}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>Use e-Rx</button>
</div>
<template data-sc="if" value="{{rxUploaded}}" hint-placeholder-val="{{false}}"><div style="{{s.fileChip}}"><span style="flex-grow: 1">prescription_23Oct.jpg · pharmacist will verify</span><button aria-label="Remove file" onClick="{{pickErx}}" style="{{s.chipX}}">×</button></div></template>
<template data-sc="if" value="{{allergyWarn}}" hint-placeholder-val="{{false}}"><div role="alert" style="{{s.warnBanner}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"></path></svg><span style="flex-grow: 1">{{allergyWarn}}</span></div></template>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="{{s.label}}">In your cart</span><span style="{{s.sub}}">{{rxNote}}</span></div>
<div style="{{s.card}}; display: flex; flex-direction: column">
<template data-sc="for" list="{{cart}}" as="md" hint-placeholder-count="3">
<div style="{{md.rowStyle}}">

<template data-sc="if" value="{{is.health}}" hint-placeholder-val="{{false}}">

<button onClick="{{openLog}}" style="{{s.smallPrimary}}">Log reading</button>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

<span style="display: flex; align-items: baseline; gap: 4px"><span style="{{v.valStyle}}">{{v.value}}</span><span style="{{s.tiny}}">{{v.unit}}</span></span>
<svg width="100%" height="26" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline points="{{v.spark}}" fill="none" stroke="{{v.color}}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline></svg>

<polyline points="{{mt.line}}" fill="none" stroke="{{mt.color}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>

<section style="{{s.card}}; padding: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">

</section>

</section>

<section style="display: flex; flex-direction: column; gap: 10px">

<template data-sc="if" value="{{modalIs.create}}" hint-placeholder-val="{{false}}">

<template data-sc="if" value="{{modalIs.partner}}" hint-placeholder-val="{{false}}">

<label style="{{s.fieldLabel}}">Area<input type="text" value="{{form.parea}}" onChange="{{f_parea}}" placeholder="e.g. Kondapur" style="{{s.input}}"></label>
</div>
</template>
<template data-sc="if" value="{{formError}}" hint-placeholder-val="{{false}}"><span style="{{s.dangerTxt}}">{{formError}}</span></template>
<div style="display: flex; justify-content: flex-end; gap: 8px">
